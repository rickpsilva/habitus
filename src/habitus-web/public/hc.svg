<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="hcGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="90" y1="0" x2="90" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>

  <!-- Shield background -->
  <path d="M90 175c35-12 80-45 80-110V25a8 8 0 0 0-8-8H18a8 8 0 0 0-8 8v40c0 65 45 98 80 110Z" fill="url(#hcGrad)"/>

  <!-- Shield inner highlight -->
  <path d="M90 165c30-11 70-40 70-100V30a5 5 0 0 0-5-5H25a5 5 0 0 0-5 5v35c0 60 40 89 70 100Z" fill="url(#hcGrad)" fill-opacity="0.15"/>

  <!-- Multi-tower skyline -->
  <g fill="url(#towerGrad)">
    <!-- Tower 1 -->
    <rect x="35" y="80" width="16" height="42" rx="2"/>
    <rect x="38" y="74" width="10" height="6" rx="1"/>
    <!-- Tower 2 -->
    <rect x="58" y="58" width="20" height="64" rx="2"/>
    <rect x="62" y="50" width="12" height="8" rx="1"/>
    <rect x="61" y="68" width="4" height="5" rx="0.8"/>
    <rect x="71" y="68" width="4" height="5" rx="0.8"/>
    <rect x="61" y="80" width="4" height="5" rx="0.8"/>
    <rect x="71" y="80" width="4" height="5" rx="0.8"/>
    <!-- Tower 3 (central tallest) -->
    <rect x="86" y="42" width="22" height="80" rx="2"/>
    <path d="M86 46 97 36l11 10v6H86v-6Z" fill="url(#towerGrad)"/>
    <rect x="91" y="55" width="5" height="6" rx="0.8"/>
    <rect x="99" y="55" width="5" height="6" rx="0.8"/>
    <rect x="91" y="68" width="5" height="6" rx="0.8"/>
    <rect x="99" y="68" width="5" height="6" rx="0.8"/>
    <rect x="91" y="81" width="5" height="6" rx="0.8"/>
    <rect x="99" y="81" width="5" height="6" rx="0.8"/>
    <!-- Tower 4 -->
    <rect x="115" y="66" width="18" height="56" rx="2"/>
    <rect x="119" y="58" width="10" height="8" rx="1"/>
    <rect x="118" y="76" width="4" height="5" rx="0.8"/>
    <rect x="126" y="76" width="4" height="5" rx="0.8"/>
    <rect x="118" y="89" width="4" height="5" rx="0.8"/>
    <rect x="126" y="89" width="4" height="5" rx="0.8"/>
    <!-- Tower 5 -->
    <rect x="140" y="88" width="14" height="34" rx="2"/>
    <rect x="143" y="82" width="8" height="6" rx="1"/>
  </g>

  <!-- Ground line -->
  <rect x="32" y="122" width="116" height="3" rx="1.5" fill="white" fill-opacity="0.9"/>

  <!-- Wordmark banner -->
  <rect x="28" y="134" width="124" height="24" rx="5" fill="white" fill-opacity="0.95"/>
  <text x="90" y="150" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#3730A3">HabitusCond</text>
</svg>