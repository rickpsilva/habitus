version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: habitus
      POSTGRES_USER: habitus
      POSTGRES_PASSWORD: habitus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitus"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src
      dockerfile: Habitus.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=habitus;Username=habitus;Password=habitus
      - JwtSettings__SecretKey=habitus-super-secret-key-for-development-only
      - JwtSettings__Issuer=habitus
      - JwtSettings__Audience=habitus-users
      - JwtSettings__ExpiryMinutes=60
      - AllowedOrigins=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./src/habitus-web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@habitus.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
