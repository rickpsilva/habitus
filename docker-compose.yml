version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: habitus
      POSTGRES_USER: habitus
      POSTGRES_PASSWORD: habitus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitus"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src
      dockerfile: Habitus.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=habitus;Username=habitus;Password=habitus
      - JwtSettings__SecretKey=habitus-super-secret-key-for-development-only
      - JwtSettings__Issuer=habitus
      - JwtSettings__Audience=habitus-users
      - JwtSettings__ExpiryMinutes=60
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
